<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1114" media="(prefers-color-scheme: dark)">
<meta name="description" content="Stride: Running for iPhone and Apple Watch. Record runs, follow training plans and cheer on friends.">
<title>Stride: Running</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B47'/%3E%3Cpath d='M9 21l6-10M15 21l6-10M21 21l3-5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --ink: #16181B;
    --muted: #5B6168;
    --line: #E4E4E1;
    --accent: #FF6B47;
    --link: #C8431F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1114;
      --surface: #161A1F;
      --ink: #ECEEF0;
      --muted: #A2A9B1;
      --line: #262C33;
      --accent: #FF6B47;
      --link: #FF8B6E;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 72px 16px 40px; }
  .icon { display: block; width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 30px rgba(255, 107, 71, 0.28); }
  h1 { font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1.08; letter-spacing: -0.03em; margin: 28px 0 10px; }
  .tagline { font-size: 1.15rem; color: var(--muted); margin: 0 0 32px; }
  .links { display: grid; gap: 12px; }
  .links a { display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; color: var(--ink); text-decoration: none; font-weight: 650; }
  .links a span { color: var(--muted); font-weight: 400; font-size: 0.95rem; }
  .links a::after { content: "\203A"; color: var(--accent); font-size: 1.5rem; line-height: 1; font-weight: 700; }
  .links a:hover { border-color: var(--accent); }
  .links a > div { min-width: 0; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <svg class="icon" viewBox="0 0 32 32" role="img" aria-label="Stride app icon"><rect width="32" height="32" rx="8" fill="#FF6B47"/><path d="M9 21l6-10M15 21l6-10M21 21l3-5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
  <h1>Stride: Running</h1>
  <p class="tagline">Record runs on iPhone and Apple Watch, follow training plans, and cheer on your friends.</p>
  <nav class="links" aria-label="Pages">
    <a href="support.html"><div>Support<br><span>Help, FAQ and contact</span></div></a>
    <a href="privacy.html"><div>Privacy Policy<br><span>No ads, no tracking, no analytics</span></div></a>
  </nav>
</main>
<footer>&copy; 2026 Alexandre de Paula Dias Junior</footer>
</body>
</html>
